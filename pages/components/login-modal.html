<div class="modal" id="loginModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('loginModal')">&times;</button>
            <h3>Student Intranet Login</h3>
            <p class="modal-sub">Sign in with your Campus Student ID to access personal dashboards.</p>
            <form id="loginForm">
                <div class="form-group">
                    <label for="studentId">Student ID</label>
                    <input type="text" id="studentId" placeholder="e.g., CS-2026-104" required>
                </div>
                <div class="form-group">
                    <label for="studentName">Full Name</label>
                    <input type="text" id="studentName" placeholder="Enter your name" required>
                </div>
                <div class="form-group">
                    <label for="studentPass">Password</label>
                    <input type="password" id="studentPass" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Sign In to Portal</button>
            </form>
        </div>
    </div>
